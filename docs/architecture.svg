<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#171717"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c03221"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17784a"/></marker>
  </defs>
  <!-- Agent -->
  <rect x="30" y="60" width="200" height="120" rx="6" fill="#fafaf9" stroke="#d9d9d5"/>
  <text x="46" y="88" font-weight="600" fill="#171717">Coding agent</text>
  <text x="46" y="110" fill="#5f5f5c">Claude Code · Cursor</text>
  <text x="46" y="128" fill="#5f5f5c">Codex · Gemini · custom</text>
  <text x="46" y="160" fill="#8f8f8b" font-size="12">edits code, tries to stop</text>
  <!-- Proofline -->
  <rect x="330" y="40" width="300" height="250" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.4"/>
  <text x="346" y="68" font-weight="600" fill="#171717">Proofline</text>
  <text x="430" y="68" fill="#8f8f8b" font-size="12">zero-dependency Node CLI</text>
  <g font-size="12" fill="#171717">
    <rect x="346" y="84" width="268" height="34" rx="4" fill="#fafaf9" stroke="#e8e8e5"/><text x="358" y="105">hook · loop · watch · pre-push trigger</text>
    <rect x="346" y="126" width="268" height="34" rx="4" fill="#fafaf9" stroke="#e8e8e5"/><text x="358" y="147">git diff → flows that guard those files</text>
    <rect x="346" y="168" width="268" height="34" rx="4" fill="#fafaf9" stroke="#e8e8e5"/><text x="358" y="189">NDJSON reader → verdict, failing step</text>
    <rect x="346" y="210" width="268" height="34" rx="4" fill="#fafaf9" stroke="#e8e8e5"/><text x="358" y="231">repair brief → agent's next prompt</text>
    <rect x="346" y="252" width="268" height="26" rx="4" fill="#fafaf9" stroke="#e8e8e5"/><text x="358" y="269">.proofline/ run + loop store</text>
  </g>
  <!-- Kane -->
  <rect x="730" y="60" width="200" height="120" rx="6" fill="#fafaf9" stroke="#d9d9d5"/>
  <text x="746" y="88" font-weight="600" fill="#171717">Kane CLI</text>
  <text x="746" y="110" fill="#5f5f5c">testmd run --agent</text>
  <text x="746" y="128" fill="#5f5f5c">real Chrome · evidence pack</text>
  <text x="746" y="160" fill="#8f8f8b" font-size="12">pass / fail + NDJSON stream</text>
  <!-- App -->
  <rect x="730" y="230" width="200" height="70" rx="6" fill="#ffffff" stroke="#d9d9d5"/>
  <text x="746" y="258" font-weight="600" fill="#171717">Your web app</text>
  <text x="746" y="280" fill="#5f5f5c">localhost or preview URL</text>
  <!-- Console -->
  <rect x="330" y="340" width="300" height="60" rx="6" fill="#fafaf9" stroke="#d9d9d5"/>
  <text x="346" y="366" font-weight="600" fill="#171717">Proofline console</text>
  <text x="346" y="386" fill="#5f5f5c">loops · runs · flows · live runs (SSE)</text>
  <!-- Arrows -->
  <path d="M230 100 H326" stroke="#171717" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="246" y="92" fill="#5f5f5c" font-size="12">Stop hook</text>
  <path d="M630 100 H726" stroke="#171717" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="646" y="92" fill="#5f5f5c" font-size="12">affected flows</text>
  <path d="M830 180 V226" stroke="#171717" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="838" y="208" fill="#5f5f5c" font-size="12">drives</text>
  <path d="M726 150 H634" stroke="#171717" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="652" y="168" fill="#5f5f5c" font-size="12">verdict</text>
  <path d="M326 230 C 280 230, 260 200, 234 168" stroke="#c03221" stroke-width="1.4" fill="none" marker-end="url(#r)"/>
  <text x="240" y="140" fill="#c03221" font-size="11">red: repair brief</text><text x="240" y="155" fill="#c03221" font-size="11">→ keep working</text>
  <path d="M326 262 C 200 262, 130 240, 130 184" stroke="#17784a" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <text x="140" y="282" fill="#17784a" font-size="12">green: allowed to stop</text>
  <path d="M480 290 V336" stroke="#171717" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
